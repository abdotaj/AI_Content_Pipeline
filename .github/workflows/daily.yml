name: Daily Content Pipeline

on:
  workflow_dispatch:
    inputs:
      channel:
        description: 'Which channel to run (darkcrimed)'
        required: false
        default: 'darkcrimed'
      pipeline_mode:
        description: 'Pipeline mode: fast | full | animation'
        required: false
        default: 'full'

jobs:
  # ── Job 1: Dark Crime Decoded ────────────────────────────────────────────
  dark-crime-pipeline:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.channel == 'darkcrimed'
    runs-on: ubuntu-latest
    # GitHub-hosted runners hard-kill any job at 6h0m0s regardless of this setting —
    # and when that hard cap fires (not this timeout), the if:always()/if:failure()
    # upload-artifact steps below never even start, so a run that hits it loses
    # everything (confirmed via run 29139245374: all upload steps stayed "pending").
    # Keep this comfortably under 360min so OUR timeout fires first and the
    # graceful-cancellation path still runs the cleanup/upload steps.
    timeout-minutes: 340
    concurrency:
      group: dark-crime-pipeline
      cancel-in-progress: false
    permissions:
      contents: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v4.2.2

      - name: Set up Python
        uses: actions/setup-python@v5.4.0
        with:
          python-version: '3.11'

      # apt packages are NOT cached — /var/cache/apt/archives/partial and lock
      # files change during apt-get install and cause tar exit code 2 on save.
      # ffmpeg + fonts install in ~25 s on ubuntu-latest; the cache saves nothing.
      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-dejavu-core

      - name: Cache pip packages
        uses: actions/cache@v4.2.3
        with:
          path: ~/.cache/pip
          key: pip-${{ hashFiles('requirements.txt') }}
          restore-keys: pip-

      - name: Cache music assets
        uses: actions/cache@v4.2.3
        with:
          path: assets/music/
          key: music-assets-v1

      - name: Install dependencies
        run: |
          pip install --upgrade pip setuptools wheel
          pip uninstall moviepy -y || true
          pip install moviepy==1.0.3
          pip install yt-dlp
          pip install -r requirements.txt
          python3 -c "import moviepy; print('MoviePy version:', moviepy.__version__)"
          echo "=== Installed packages ==="
          pip show openai groq httpx moviepy edge-tts yt-dlp

      - name: Write YouTube token (Arabic channel)
        env:
          YOUTUBE_TOKEN_AR: ${{ secrets.YOUTUBE_TOKEN_JSON_DARKCRIMED_AR }}
        run: echo "$YOUTUBE_TOKEN_AR" > youtube_token_darkcrimed_ar.json

      - name: Write YouTube token (English channel)
        env:
          YOUTUBE_TOKEN_EN: ${{ secrets.YOUTUBE_TOKEN_JSON_DARKCRIMED_EN }}
        run: echo "$YOUTUBE_TOKEN_EN" > youtube_token_darkcrimed_en.json

      - name: Write YouTube token (generic)
        env:
          YOUTUBE_TOKEN: ${{ secrets.YOUTUBE_TOKEN_JSON }}
        run: echo "$YOUTUBE_TOKEN" > youtube_token.json

      - name: Verify tokens
        run: |
          echo "=== Token files ==="
          ls -la youtube_token_darkcrimed_ar.json youtube_token_darkcrimed_en.json youtube_token.json
          echo "=== AR token channel ==="
          python3 -c "import json; d=json.load(open('youtube_token_darkcrimed_ar.json')); print(d.get('channel_id','MISSING'))"
          echo "=== EN token channel ==="
          python3 -c "import json; d=json.load(open('youtube_token_darkcrimed_en.json')); print(d.get('channel_id','MISSING'))"

      - name: Run Dark Crime pipeline
        env:
          PYTHONUNBUFFERED:                  "1"
          VIDEOS_PER_DAY:                    "1"
          ENABLE_PREMIUM_INTRO:              "0"
          PIPELINE_MODE:                     ${{ github.event.inputs.pipeline_mode || 'full' }}
          ANTHROPIC_API_KEY:                 ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_PROXY_URL:               ${{ secrets.ANTHROPIC_PROXY_URL }}
          ANTHROPIC_PROXY_LIST:              ${{ secrets.ANTHROPIC_PROXY_LIST }}
          GROQ_API_KEY:                      ${{ secrets.GROQ_API_KEY }}
          OPENAI_API_KEY:                    ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY:                    ${{ secrets.GEMINI_API_KEY }}
          ELEVENLABS_API_KEY:                ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID_EN:            ${{ secrets.ELEVENLABS_VOICE_ID_EN }}
          ELEVENLABS_VOICE_ID_AR:            ${{ secrets.ELEVENLABS_VOICE_ID_AR }}
          PEXELS_API_KEY:                    ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY:                   ${{ secrets.PIXABAY_API_KEY }}
          CUSTOM_SEARCH:                     ${{ secrets.CUSTOM_SEARCH }}
          GOOGLE_CSE_ID:                     ${{ secrets.GOOGLE_CSE_ID }}
          TELEGRAM_BOT_TOKEN:                ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:                  ${{ secrets.TELEGRAM_CHAT_ID }}
          YOUTUBE_CLIENT_ID_AR:              ${{ secrets.YOUTUBE_CLIENT_ID_DARKCRIMED }}
          YOUTUBE_CLIENT_SECRET_AR:          ${{ secrets.YOUTUBE_CLIENT_SECRET_DARKCRIMED }}
          YOUTUBE_CLIENT_ID_EN:              ${{ secrets.YOUTUBE_CLIENT_ID_DARKCRIMED }}
          YOUTUBE_CLIENT_SECRET_EN:          ${{ secrets.YOUTUBE_CLIENT_SECRET_DARKCRIMED }}
          TIKTOK_CLIENT_KEY:                 ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET:              ${{ secrets.TIKTOK_CLIENT_SECRET }}
          FACEBOOK_ACCESS_TOKEN:             ${{ secrets.FACEBOOK_ACCESS_TOKEN }}
          FACEBOOK_PAGE_ID:                  ${{ secrets.FACEBOOK_PAGE_ID }}
          X_API_KEY:                         ${{ secrets.X_API_KEY }}
          X_API_SECRET:                      ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN:                    ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET:             ${{ secrets.X_ACCESS_TOKEN_SECRET }}
          X_BEARER_TOKEN:                    ${{ secrets.X_BEARER_TOKEN }}
        run: |
          # Background resource monitor — same step, so its output lands in this
          # step's own live log. If the runner is later OOM-killed or fills its disk
          # ("lost communication with the server"), if:always() upload steps never
          # run, but this already streamed to GitHub's log service and survives in
          # the raw log — giving the actual memory/disk trend leading up to the
          # crash instead of guessing.
          ( while true; do
              echo "=== [monitor] $(date -u +%H:%M:%S) ==="
              free -h | grep -E 'Mem|Swap'
              df -h / | tail -1
              sleep 120
            done ) &
          MONITOR_PID=$!
          python run_darkcrimed.py
          EXIT_CODE=$?
          kill "$MONITOR_PID" 2>/dev/null || true
          exit $EXIT_CODE

      # topic_inject.json and content/scripts/*.txt|.json injection files are
      # consumed on the runner's disk (os.remove / moved to content/scripts/_used/)
      # but that disk is thrown away when the job ends. Without committing the
      # consumption back, the next run's checkout still has the original committed
      # file and re-injects the same topic forever (see: Kray Twins re-running
      # after being deleted locally). Only do this on success — on failure we want
      # the same injected topic to be retried next run.
      - name: Commit consumed injection files
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A -- topic_inject.json content/scripts/
          if git diff --cached --quiet; then
            echo "No injection state to commit."
          else
            git commit -m "chore: consume topic/script injection files [skip ci]"
            git push
          fi

      - name: Upload all videos as artifacts
        if: always()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: dark-crime-videos-${{ github.run_id }}
          path: |
            output/dark_crime/final/*.mp4
            output/shorts/*.mp4
            output_videos/
            output/dark_crime/manifest_*.json
          retention-days: 5
          if-no-files-found: warn

      - name: Upload shorts as artifacts
        if: always()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: dark-crime-shorts-${{ github.run_id }}
          path: |
            output/shorts/*.mp4
            output_videos/*_short.mp4
          retention-days: 5
          if-no-files-found: warn

      - name: Upload scripts and images as backup
        if: always()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: dark-crime-content-${{ github.run_id }}
          path: |
            output/dark_crime/scripts/
            output/images/
          retention-days: 2
          if-no-files-found: warn

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: dark-crime-error-logs
          path: output/dark_crime/
          retention-days: 7

